name: iOS Build (unsigned)

# Builds the iOS app on a cloud macOS runner to PROVE it compiles.
# This produces an UNSIGNED simulator build — it is NOT installable on a
# physical iPhone (Apple requires code signing for that; see codemagic.yaml
# for the signed/.ipa path).
#
# Requires repo secrets (same ones used by android-build.yml):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # Capacitor 8 uses Swift Package Manager (no CocoaPods/Podfile).
      - name: Compile (unsigned, simulator)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            TARGET=(-workspace ios/App/App.xcworkspace)
          else
            TARGET=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${TARGET[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build
